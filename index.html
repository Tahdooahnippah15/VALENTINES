<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>
  <style>
    :root{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --bg1:#ffd1dc; --bg2:#fff0f5; --bg3:#ffe4e1;
      --card: rgba(255,255,255,.88);
      --shadow: rgba(120,10,40,.18);
      --hot:#ff2d76; --deep:#b0003a;
      --text:#2b0a14;
    }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:
        radial-gradient(circle at 20% 10%, var(--bg2), transparent 55%),
        radial-gradient(circle at 80% 0%, var(--bg1), transparent 60%),
        radial-gradient(circle at 50% 100%, var(--bg3), transparent 60%),
        linear-gradient(180deg, #fff, #ffe9f0);
      overflow:hidden; color:var(--text);
    }
    .card{
      width:min(760px,92vw);
      padding:30px; border-radius:22px;
      background:rgba(255,255,255,.88);
      box-shadow:0 22px 70px var(--shadow);
      text-align:center;
      border:1px solid rgba(176,0,58,.12);
      backdrop-filter: blur(6px);
      position:relative;
      z-index: 1;
    }
    h1{ margin:0 0 18px; font-size:clamp(28px,5vw,46px); }

    .buttons{
      display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:10px;
      position: relative; z-index: 2;
    }

    button{
      border:0; border-radius:999px; padding:14px 22px; font-size:18px;
      cursor:pointer; user-select:none; touch-action:manipulation;
      transition: transform .12s ease, filter .12s ease;
      box-shadow: 0 12px 30px rgba(176,0,58,.22);
    }
    button:hover{ transform: translateY(-1px); filter: brightness(1.04); }

    #yesBtn{
      background: linear-gradient(135deg, var(--hot), var(--deep));
      color:#fff;
      outline:2px solid rgba(255,45,118,.18);
    }
    #noBtn{
      background: linear-gradient(180deg, #2a0612, #12030a);
      color:#fff;
    }

    #reveal{ display:none; margin-top:20px; }
    .caption{
      font-size:22px; margin:14px 0 10px; font-weight:800; color:var(--deep);
      text-shadow:0 1px 0 rgba(255,45,118,.10);
    }
    #reveal img{
      width:min(540px,92%);
      border-radius:18px;
      box-shadow:0 18px 50px rgba(120,10,40,.22);
      border:1px solid rgba(255,45,118,.18);
    }
    .tiny{ opacity:.75; font-size:14px; margin-top:10px; }

    /* Visible version tag so you KNOW you're seeing the new build */
    .ver{
      position: fixed;
      left: 12px;
      bottom: 10px;
      font-size: 12px;
      opacity: .65;
      z-index: 9999;
    }

    canvas.confetti{ position:fixed; inset:0; pointer-events:none; z-index:10; }
  </style>
</head>
<body>
  <canvas class="confetti" id="confetti"></canvas>
  <div class="ver">v-FLYING-NO</div>

  <div class="card">
    <h1>Will you be my valentine?</h1>

    <div class="buttons">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </div>

    <div id="reveal">
      <div class="caption">Congratulations, you may live another day</div>
      <img id="photo" alt="Custom photo" />
      <div class="tiny">If the image doesn’t show, your filename/path is wrong.</div>
    </div>
  </div>

  <audio id="bgAudio"></audio>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn  = document.getElementById('noBtn');
    const reveal = document.getElementById('reveal');
    const photo  = document.getElementById('photo');
    const bgAudio = document.getElementById('bgAudio');

    // Make NO button continuously bounce around the screen (no hiding)
    let x, y, vx = 3.2, vy = 2.7;

    function startNoButtonFlying() {
      // Grab initial position so it starts from where it appears
      const r = noBtn.getBoundingClientRect();
      x = r.left;
      y = r.top;

      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top  = y + 'px';
      noBtn.style.zIndex = 6;

      const padding = 10;

      function step() {
        const rect = noBtn.getBoundingClientRect();

        x += vx;
        y += vy;

        // bounce
        if (x <= padding || x + rect.width >= innerWidth - padding) vx *= -1;
        if (y <= padding || y + rect.height >= innerHeight - padding) vy *= -1;

        noBtn.style.left = x + 'px';
        noBtn.style.top  = y + 'px';

        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    startNoButtonFlying();

    // If clicked, speed up (optional)
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      vx *= 1.2; vy *= 1.2;
    });

    yesBtn.addEventListener('click', async () => {
      reveal.style.display = 'block';

      photo.src = 'photo.jpg';
      bgAudio.src = 'song.mp3';
      bgAudio.currentTime = 0;
      bgAudio.volume = 0.9;

      try { await bgAudio.play(); } catch (e) {}

      launchConfetti();
    });

    function launchConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');

      function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
      resize();
      addEventListener('resize', resize);

      const colors = ['#ff2d76','#ff4d6d','#ff8fab','#b0003a','#ff5c8a','#ffd1dc'];

      const pieces = Array.from({ length: 220 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.3,
        w: 6 + Math.random() * 8,
        h: 4 + Math.random() * 6,
        vx: (Math.random() * 2 - 1) * 2.4,
        vy: 2 + Math.random() * 5.0,
        a: Math.random() * Math.PI * 2,
        va: (Math.random() * 2 - 1) * 0.16,
        life: 240 + Math.random() * 120,
        c: colors[(Math.random() * colors.length) | 0]
      }));

      let frame = 0;
      (function tick() {
        frame++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const p of pieces) {
          p.x += p.vx;
          p.y += p.vy;
          p.a += p.va;
          p.vy += 0.02;
          p.life--;

          if (p.x < -20) p.x = canvas.width + 20;
          if (p.x > canvas.width + 20) p.x = -20;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.a);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        }

        const alive = pieces.some(p => p.life > 0 && p.y < canvas.height + 40);
        if (alive && frame < 650) requestAnimationFrame(tick);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      })();
    }
  </script>
</body>
</html>
