<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>

  <style>
    :root{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --bg1:#ffd1dc; --bg2:#fff0f5; --bg3:#ffe4e1;
      --card: rgba(255,255,255,.88);
      --shadow: rgba(120,10,40,.18);
      --hot:#ff2d76; --deep:#b0003a;
      --text:#2b0a14;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 20% 10%, var(--bg2), transparent 55%),
        radial-gradient(circle at 80% 0%, var(--bg1), transparent 60%),
        radial-gradient(circle at 50% 100%, var(--bg3), transparent 60%),
        linear-gradient(180deg, #fff, #ffe9f0);
      overflow:hidden;
      color:var(--text);
    }

    .card{
      width:min(760px,92vw);
      padding:30px;
      border-radius:22px;
      background:var(--card);
      box-shadow:0 22px 70px var(--shadow);
      text-align:center;
      border:1px solid rgba(176,0,58,.12);
      backdrop-filter: blur(6px);
      position:relative;
      z-index:2;
    }

    h1{ margin:0 0 18px; font-size:clamp(28px,5vw,46px); }

    .buttons{
      display:flex;
      gap:14px;
      justify-content:center;
      margin-top:10px;
      min-height:60px;
      position:relative;
      z-index:3;
    }

    button{
      border:0;
      border-radius:999px;
      padding:14px 22px;
      font-size:18px;
      cursor:pointer;
      box-shadow:0 12px 30px rgba(176,0,58,.22);
      transition: transform .12s ease, filter .12s ease;
    }

    button:hover{ transform: translateY(-1px); filter: brightness(1.04); }

    #yesBtn{
      background: linear-gradient(135deg, var(--hot), var(--deep));
      color:#fff;
    }

    #noBtn{
      background: linear-gradient(180deg, #2a0612, #12030a);
      color:#fff;
    }

    #reveal{ display:none; margin-top:20px; }

    .caption{
      font-size:22px;
      margin:14px 0 10px;
      font-weight:800;
      color:var(--deep);
    }

    #reveal img{
      width:min(540px,92%);
      border-radius:18px;
      box-shadow:0 18px 50px rgba(120,10,40,.22);
    }

    .tiny{ opacity:.7; font-size:14px; }

    /* Hearts */
    .hearts{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
    }

    .heart{
      position:absolute;
      width:14px;
      height:14px;
      background:#ff4d6d;
      transform:rotate(45deg);
      opacity:.6;
      animation:floatUp linear infinite;
    }

    .heart::before,
    .heart::after{
      content:'';
      position:absolute;
      width:14px;
      height:14px;
      background:inherit;
      border-radius:50%;
    }

    .heart::before{ top:-7px; left:0; }
    .heart::after{ left:-7px; top:0; }

    @keyframes floatUp{
      from{ transform:translateY(110vh) rotate(45deg); opacity:0; }
      10%{ opacity:.6; }
      to{ transform:translateY(-140px) rotate(45deg); opacity:0; }
    }

    canvas.confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:10;
    }

    .ver{
      position:fixed;
      left:12px;
      bottom:10px;
      font-size:12px;
      opacity:.6;
      z-index:9999;
    }
  </style>
</head>

<body>
  <div class="hearts" id="hearts"></div>
  <canvas class="confetti" id="confetti"></canvas>
  <div class="ver">v-NO-IN-CARD-1S</div>

  <div class="card" id="card">
    <h1>Will you be my valentine?</h1>

    <div class="buttons" id="buttonsRow">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div id="reveal">
      <div class="caption">Congratulations, you may live another day</div>
      <img id="photo" alt="Custom photo">
      <div class="tiny">If it doesn’t load, your filename is wrong.</div>
    </div>
  </div>

  <audio id="bgAudio"></audio>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn  = document.getElementById('noBtn');
    const card   = document.getElementById('card');
    const reveal = document.getElementById('reveal');
    const photo  = document.getElementById('photo');
    const bgAudio = document.getElementById('bgAudio');

    /* Floating hearts */
    const hearts = document.getElementById('hearts');
    const colors = ['#ff2d76','#ff4d6d','#ff8fab','#b0003a'];

    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      const size = 10 + Math.random()*14;
      const dur = 6 + Math.random()*6;
      h.style.width = h.style.height = size + 'px';
      h.style.left = Math.random()*100 + 'vw';
      h.style.background = colors[Math.floor(Math.random()*colors.length)];
      h.style.animationDuration = dur + 's';
      hearts.appendChild(h);
      setTimeout(() => h.remove(), dur*1000);
    }, 450);

    /* NO button: 1 second delay */
    const DELAY_MS = 1000;
    const padding = 10;
    let x, y, vx = 2.6, vy = 2.1;

    setTimeout(() => {
      const noRect = noBtn.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();

      x = noRect.left - cardRect.left;
      y = noRect.top  - cardRect.top;

      noBtn.style.position = 'absolute';
      noBtn.style.left = x + 'px';
      noBtn.style.top  = y + 'px';

      function move(){
        const rect = noBtn.getBoundingClientRect();
        const maxX = card.clientWidth  - rect.width  - padding;
        const maxY = card.clientHeight - rect.height - padding;

        x += vx; y += vy;

        if (x <= padding || x >= maxX) vx *= -1;
        if (y <= padding || y >= maxY) vy *= -1;

        noBtn.style.left = x + 'px';
        noBtn.style.top  = y + 'px';

        requestAnimationFrame(move);
      }
      requestAnimationFrame(move);
    }, DELAY_MS);

    noBtn.addEventListener('click', e => {
      e.preventDefault();
      vx *= 1.15; vy *= 1.15;
    });

    yesBtn.addEventListener('click', async () => {
      reveal.style.display = 'block';
      photo.src = 'photo.jpg';
      bgAudio.src = 'song.mp3';
      try{ await bgAudio.play(); }catch(e){}
      confetti();
    });

    function confetti(){
      const c = document.getElementById('confetti');
      const ctx = c.getContext('2d');
      c.width = innerWidth; c.height = innerHeight;

      const pieces = Array.from({length:220},()=>({
        x:Math.random()*c.width,
        y:-20,
        w:6+Math.random()*8,
        h:4+Math.random()*6,
        vx:(Math.random()*2-1)*2.4,
        vy:2+Math.random()*5,
        r:Math.random()*Math.PI,
        c:colors[Math.floor(Math.random()*colors.length)]
      }));

      (function tick(){
        ctx.clearRect(0,0,c.width,c.height);
        for(const p of pieces){
          p.x+=p.vx; p.y+=p.vy; p.vy+=0.02;
          ctx.save();
          ctx.translate(p.x,p.y);
          ctx.rotate(p.r);
          ctx.fillStyle=p.c;
          ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
          ctx.restore();
        }
        requestAnimationFrame(tick);
      })();
    }
  </script>
</body>
</html>
